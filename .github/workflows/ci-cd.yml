name: CI/CD

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./ci-tests.db
      SEED_DEMO_DATA: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen --python 3.12

      - name: Prepare test database
        working-directory: backend
        run: uv run --frozen --python 3.12 alembic upgrade head

      - name: Run backend unit tests
        working-directory: backend
        run: uv run --frozen --python 3.12 pytest tests/test_api.py tests/test_store.py

  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --run

  compose-tests:
    name: Compose integration and E2E tests
    needs: [backend-tests, frontend-tests]
    runs-on: ubuntu-latest
    env:
      POSTGRES_DB: evenly
      POSTGRES_USER: evenly
      POSTGRES_PASSWORD: integration-only
      SEED_DEMO_DATA: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Build the Docker Compose stack
        run: docker compose build

      - name: Run backend Compose integration tests
        working-directory: backend
        run: |
          uv sync --frozen --python 3.12
          uv run --python 3.12 pytest tests/integration/test_compose.py

      - name: Install E2E dependencies
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run browser E2E tests against Compose
        working-directory: e2e
        run: npm test

  build-and-deploy-dev:
    name: Build image and deploy development
    needs: [compose-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ghcr.io/folakunmi21/ai-dev-tools-zoomcamp
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.DEV_RENDER_SERVICE_ID }}
      RENDER_SERVICE_URL: ${{ secrets.DEV_RENDER_SERVICE_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image version
        id: version
        shell: bash
        run: |
          version="$(date -u +%Y-%m-%d)-${GITHUB_SHA}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_NAME}:${version}" >> "$GITHUB_OUTPUT"

      - name: Build and push production image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.version.outputs.image_tag }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Deploy image digest to development
        env:
          IMAGE_REF: ${{ env.IMAGE_NAME }}@${{ steps.image.outputs.digest }}
        shell: bash
        run: |
          test -n "$RENDER_API_KEY"
          test -n "$RENDER_SERVICE_ID"
          response=$(curl --fail --silent --show-error \
            --request POST \
            --url "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            --header "Authorization: Bearer ${RENDER_API_KEY}" \
            --header "Content-Type: application/json" \
            --data "$(jq -n --arg image "$IMAGE_REF" '{imageUrl: $image}')")
          deploy_id=$(jq -r '.id // empty' <<< "$response")
          test -n "$deploy_id"
          echo "deploy_id=$deploy_id" >> "$GITHUB_ENV"
          echo "Deployed $IMAGE_REF to development (deploy $deploy_id)"

      - name: Wait for development deployment
        shell: bash
        run: |
          for attempt in $(seq 1 90); do
            response=$(curl --fail --silent --show-error \
              --url "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys/${deploy_id}" \
              --header "Authorization: Bearer ${RENDER_API_KEY}")
            status=$(jq -r '.status' <<< "$response")
            echo "Render development deployment status: $status"
            case "$status" in
              live) exit 0 ;;
              build_failed|update_failed|pre_deploy_failed|canceled|deactivated)
                echo "Render development deployment failed with status: $status"
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "Timed out waiting for Render development deployment ${deploy_id}"
          exit 1

      - name: Verify development health endpoint
        shell: bash
        run: |
          test -n "$RENDER_SERVICE_URL"
          health_url="${RENDER_SERVICE_URL%/}/health"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "$health_url"; then
              echo
              exit 0
            fi
            sleep 5
          done
          echo "Health check failed: $health_url"
          exit 1

      - name: Publish image details to workflow summary
        env:
          IMAGE_REF: ${{ env.IMAGE_NAME }}@${{ steps.image.outputs.digest }}
        run: |
          {
            echo "### Development image"
            echo
            echo "Version: \`${{ steps.version.outputs.version }}\`"
            echo "Digest: \`${{ steps.image.outputs.digest }}\`"
            echo "Image: \`$IMAGE_REF\`"
          } >> "$GITHUB_STEP_SUMMARY"
