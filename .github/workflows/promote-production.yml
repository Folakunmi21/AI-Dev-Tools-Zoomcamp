name: Promote dev to production

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Commit SHA currently deployed to dev-evenly-fdcm
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  promote:
    name: Deploy selected dev commit to production
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.PRODUCTION_RENDER_SERVICE_ID }}
      RENDER_SERVICE_URL: ${{ secrets.PRODUCTION_RENDER_SERVICE_URL }}
      COMMIT_SHA: ${{ inputs.commit_sha }}
    steps:
      - name: Check out promoted commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Apply production database migrations
        working-directory: backend
        run: |
          test -n "$DATABASE_URL"
          uv sync --frozen --python 3.12
          uv run --python 3.12 alembic upgrade head

      - name: Trigger Render production deployment
        id: render-deploy
        run: |
          test -n "$RENDER_API_KEY"
          test -n "$RENDER_SERVICE_ID"
          response=$(curl --fail --silent --show-error \
            --request POST \
            --url "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            --header "Authorization: Bearer ${RENDER_API_KEY}" \
            --header "Content-Type: application/json" \
            --data "{\"commitId\":\"${COMMIT_SHA}\"}")
          deploy_id=$(jq -r '.id // empty' <<< "$response")
          test -n "$deploy_id"
          echo "deploy_id=$deploy_id" >> "$GITHUB_OUTPUT"

      - name: Wait for Render deployment
        env:
          DEPLOY_ID: ${{ steps.render-deploy.outputs.deploy_id }}
        run: |
          for attempt in $(seq 1 90); do
            response=$(curl --fail --silent --show-error \
              --url "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys/${DEPLOY_ID}" \
              --header "Authorization: Bearer ${RENDER_API_KEY}")
            status=$(jq -r '.status' <<< "$response")
            echo "Render deployment status: $status"
            case "$status" in
              live) exit 0 ;;
              build_failed|update_failed|pre_deploy_failed|canceled|deactivated)
                echo "Render deployment failed with status: $status"
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "Timed out waiting for Render deployment ${DEPLOY_ID}"
          exit 1

      - name: Verify production health endpoint
        run: |
          test -n "$RENDER_SERVICE_URL"
          health_url="${RENDER_SERVICE_URL%/}/health"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "$health_url"; then
              echo
              exit 0
            fi
            sleep 5
          done
          echo "Health check failed: $health_url"
          exit 1
