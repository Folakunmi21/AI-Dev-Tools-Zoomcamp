name: Promote dev to production

on:
  workflow_dispatch:
    inputs:
      image_digest:
        description: Image digest currently deployed to dev-evenly-fdcm (sha256:...)
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  promote:
    name: Deploy selected dev image to production
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.PRODUCTION_RENDER_SERVICE_ID }}
      RENDER_SERVICE_URL: ${{ secrets.PRODUCTION_RENDER_SERVICE_URL }}
      IMAGE_NAME: ghcr.io/folakunmi21/ai-dev-tools-zoomcamp
      IMAGE_DIGEST: ${{ inputs.image_digest }}
    steps:
      - name: Validate image digest
        run: |
          [[ "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]

      - name: Validate production database endpoint
        run: |
          test -n "$DATABASE_URL"
          database_host=$(python - <<'PY'
          import os
          from urllib.parse import urlparse

          configured = os.environ["DATABASE_URL"]
          parsed = urlparse(configured)
          if not parsed.hostname:
              raise SystemExit("DATABASE_URL does not contain a hostname")
          print(parsed.hostname)
          PY
          )

          case "$database_host" in
            db.*.supabase.co)
              echo "PRODUCTION_DATABASE_URL points to Supabase's direct database endpoint ($database_host)."
              echo "Use the IPv4-compatible Session Pooler URL from Supabase's Connect dialog in GitHub and Render."
              exit 1
              ;;
          esac

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull promoted image
        env:
          IMAGE_REF: ${{ env.IMAGE_NAME }}@${{ inputs.image_digest }}
        run: docker pull "$IMAGE_REF"

      - name: Apply production database migrations from promoted image
        env:
          IMAGE_REF: ${{ env.IMAGE_NAME }}@${{ inputs.image_digest }}
        run: |
          test -n "$DATABASE_URL"
          docker run --rm \
            --env DATABASE_URL="$DATABASE_URL" \
            "$IMAGE_REF" \
            alembic upgrade head

      - name: Trigger Render production deployment
        id: render-deploy
        env:
          IMAGE_REF: ${{ env.IMAGE_NAME }}@${{ inputs.image_digest }}
        run: |
          test -n "$RENDER_API_KEY"
          test -n "$RENDER_SERVICE_ID"
          response=$(curl --fail --silent --show-error \
            --request POST \
            --url "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            --header "Authorization: Bearer ${RENDER_API_KEY}" \
            --header "Content-Type: application/json" \
            --data "$(jq -n --arg image "$IMAGE_REF" '{imageUrl: $image}')")
          deploy_id=$(jq -r '.id // empty' <<< "$response")
          test -n "$deploy_id"
          echo "deploy_id=$deploy_id" >> "$GITHUB_OUTPUT"

      - name: Wait for Render deployment
        env:
          DEPLOY_ID: ${{ steps.render-deploy.outputs.deploy_id }}
        run: |
          for attempt in $(seq 1 90); do
            response=$(curl --fail --silent --show-error \
              --url "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys/${DEPLOY_ID}" \
              --header "Authorization: Bearer ${RENDER_API_KEY}")
            status=$(jq -r '.status' <<< "$response")
            echo "Render deployment status: $status"
            case "$status" in
              live) exit 0 ;;
              build_failed|update_failed|pre_deploy_failed|canceled|deactivated)
                echo "Render deployment failed with status: $status"
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "Timed out waiting for Render deployment ${DEPLOY_ID}"
          exit 1

      - name: Verify production health endpoint
        run: |
          test -n "$RENDER_SERVICE_URL"
          health_url="${RENDER_SERVICE_URL%/}/health"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "$health_url"; then
              echo
              exit 0
            fi
            sleep 5
          done
          echo "Health check failed: $health_url"
          exit 1

      - name: Publish production image details to workflow summary
        env:
          IMAGE_REF: ${{ env.IMAGE_NAME }}@${{ inputs.image_digest }}
        run: |
          {
            echo "### Production image"
            echo
            echo "Digest: \`${{ inputs.image_digest }}\`"
            echo "Image: \`$IMAGE_REF\`"
          } >> "$GITHUB_STEP_SUMMARY"
