[project]
name = "evenly-backend"
version = "0.1.0"
description = "Database-backed FastAPI backend for Evenly"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "python-multipart>=0.0.9,<1",
  "sqlalchemy>=2.0.54",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.20.0",
]

[dependency-groups]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
