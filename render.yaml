services:
  - type: web
    name: evenly-fdcm
    runtime: docker
    plan: free
    autoDeployTrigger: off
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      # Configure these to an externally reachable OTLP Collector. A Collector
      # running on a developer laptop cannot receive telemetry from Render.
      - key: OTEL_EXPORTER_OTLP_METRICS_ENDPOINT
        sync: false
      - key: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
        sync: false
      - key: OTEL_SERVICE_VERSION
        sync: false
