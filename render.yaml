services:
  - type: web
    name: evenly-fdcm
    runtime: docker
    plan: free
    autoDeployTrigger: off
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      # Configure these to the same externally reachable OTLP Collector used by
      # the development service. A laptop Collector cannot receive Render data.
      - key: OTEL_EXPORTER_OTLP_ENDPOINT
        sync: false
      - key: OTEL_EXPORTER_OTLP_METRICS_ENDPOINT
        sync: false
      - key: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
        sync: false
      - key: OTEL_EXPORTER_OTLP_LOGS_ENDPOINT
        sync: false
      - key: OTEL_SERVICE_VERSION
        sync: false
