services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-evenly}
      POSTGRES_USER: ${POSTGRES_USER:-evenly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-evenly}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-evenly}:${POSTGRES_PASSWORD:-evenly}@postgres:5432/${POSTGRES_DB:-evenly}
    ports:
      - "8000:8000"

volumes:
  postgres-data:
